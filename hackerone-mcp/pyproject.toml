[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackerone-research-mcp"
version = "0.1.0"
description = "Researcher-focused HackerOne MCP with local evidence and a durable submission journal"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30.0,<2", "httpx>=0.28.1,<1", "cvss==3.6"]

[project.scripts]
hackerone-mcp = "hackerone_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
